<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>对话</title>
<style>
:root{
  --bg:#ffffff; --ink:#1c2230; --muted:#6a7285; --line:#e3e6ee;
  --user:#edf0f7; --accent:#2c56d9; --code:#f4f5f9; --err:#c0392b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#13161d; --ink:#e4e7ef; --muted:#8b93a7; --line:#262b38;
    --user:#1e2330; --accent:#7c9bff; --code:#1a1e29; --err:#ff7b6b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  display:flex;flex-direction:column;
}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
}
header .sp{flex:1}
header button,header select{
  background:none;border:1px solid transparent;border-radius:8px;
  padding:6px 10px;font-size:15px;
}
header button:hover,header select:hover{background:var(--user)}
header select{max-width:52vw;border-color:var(--line);background:var(--bg)}

main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;padding:24px 18px 32px}
.empty{color:var(--muted);text-align:center;margin-top:30vh;font-size:17px}

.msg{margin:0 0 28px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{
  background:var(--user);border-radius:16px;padding:10px 16px;
  max-width:88%;white-space:pre-wrap;word-break:break-word;
}
.body{font-size:18px;line-height:1.8;word-break:break-word}
.msg.assistant .body>*:first-child{margin-top:0}
.msg.assistant .body>*:last-child{margin-bottom:0}
.body p{margin:0 0 .9em}
.body h2,.body h3,.body h4{margin:1.2em 0 .5em;line-height:1.4}
.body h2{font-size:1.3em}.body h3{font-size:1.15em}.body h4{font-size:1em}
.body ul,.body ol{margin:0 0 .9em;padding-left:1.5em}
.body li{margin:.2em 0}
.body blockquote{margin:0 0 .9em;padding:.1em 1em;border-left:3px solid var(--line);color:var(--muted)}
.body a{color:var(--accent)}
.body code{background:var(--code);padding:.1em .35em;border-radius:5px;font-size:.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.body pre{position:relative;background:var(--code);border-radius:10px;padding:14px 16px;margin:0 0 1em;overflow-x:auto}
.body pre code{background:none;padding:0;font-size:15px;line-height:1.6;white-space:pre}
.body pre .copy{position:absolute;top:6px;right:8px;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;font-size:12px;padding:2px 8px;color:var(--muted)}
.err{color:var(--err);white-space:pre-wrap}
.acts{margin-top:6px;display:flex;gap:14px}
.acts button{background:none;border:none;padding:2px 0;color:var(--muted);font-size:14px}
.acts button:hover{color:var(--ink)}
.cursor::after{content:"▍";color:var(--muted);animation:blink 1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.cursor::after{animation:none}}
@keyframes blink{50%{opacity:0}}

footer{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.box{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
  border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px}
.box:focus-within{border-color:var(--accent)}
textarea{flex:1;border:none;background:none;resize:none;outline:none;
  font-size:17px;line-height:1.6;max-height:40vh;padding:4px 0}
#send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:15px;white-space:nowrap}
body.busy #send{background:var(--muted)}
@media (prefers-color-scheme:dark){#send{color:#0d1020}}

#drawer{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:var(--bg);
  border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .18s;
  z-index:5;display:flex;flex-direction:column}
#drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:4}
#scrim.open{display:block}
#drawer h3{margin:0;padding:16px 16px 8px;font-size:15px;color:var(--muted);font-weight:500}
#list{flex:1;overflow-y:auto;padding:0 8px 16px}
.item{display:flex;align-items:center;gap:4px;border-radius:8px}
.item:hover,.item.on{background:var(--user)}
.item .t{flex:1;text-align:left;background:none;border:none;padding:10px;font-size:15px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{background:none;border:none;color:var(--muted);padding:6px 10px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);
  width:min(520px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;margin:14px 0 4px;font-size:14px;color:var(--muted)}
dialog input,dialog textarea,dialog select{width:100%;border:1px solid var(--line);background:var(--bg);
  border-radius:8px;padding:8px 10px;font-size:15px}
dialog textarea{max-height:none;resize:vertical;line-height:1.5}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
dialog .row button{border:1px solid var(--line);background:none;border-radius:8px;padding:7px 16px}
dialog .row .ok{background:var(--accent);border-color:var(--accent);color:#fff}
dialog small{color:var(--muted);display:block;margin-top:4px;line-height:1.5}
</style>
</head>
<body>

<header>
  <button id="hist" aria-label="历史对话">历史</button>
  <select id="model" aria-label="模型"></select>
  <span class="sp"></span>
  <button id="new">新对话</button>
  <button id="set">设置</button>
</header>

<main id="main"><div class="col" id="msgs"></div></main>

<footer>
  <div class="box">
    <textarea id="inp" rows="1" placeholder="输入消息"></textarea>
    <button id="send">发送</button>
  </div>
</footer>

<div id="scrim"></div>
<aside id="drawer"><h3>历史对话</h3><div id="list"></div></aside>

<dialog id="dlg">
  <h3 style="margin:0">设置</h3>
  <label for="mode">连接方式</label>
  <select id="mode">
    <option value="direct">浏览器直连 OpenRouter（快，逐字输出）</option>
    <option value="gh">GitHub 中转（出差更稳，整段返回）</option>
  </select>
  <div id="keybox">
    <label for="key">OpenRouter API Key</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-or-v1-...">
    <small>只保存在这台设备的浏览器里，不会上传到 GitHub。</small>
  </div>
  <div id="ghbox">
    <label for="repo">中转仓库（用户名/仓库名，建议私有）</label>
    <input id="repo" autocomplete="off" placeholder="yourname/chat-relay">
    <label for="gh">GitHub Token（仅需该仓库的 Issues 读写）</label>
    <input id="gh" type="password" autocomplete="off" placeholder="github_pat_...">
    <small>OpenRouter Key 存放在仓库的 Secrets 里，不经过浏览器。</small>
  </div>
  <label for="sys">系统提示词（可留空）</label>
  <textarea id="sys" rows="3"></textarea>
  <label for="mods">模型列表（每行一个：模型ID|显示名）</label>
  <textarea id="mods" rows="6" spellcheck="false"></textarea>
  <div class="row">
    <button id="cancel">取消</button>
    <button id="save" class="ok">保存</button>
  </div>
</dialog>

<script>
const DEFAULT_MODELS=[
  "anthropic/claude-sonnet-4.5|Claude Sonnet 4.5",
  "anthropic/claude-haiku-4.5|Claude Haiku 4.5（快）",
  "openai/gpt-4o|GPT-4o",
  "google/gemini-2.5-pro|Gemini 2.5 Pro",
  "deepseek/deepseek-chat|DeepSeek V3（中文好）"
].join("\n");

const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};

let cfg=Object.assign({key:"",system:"",models:DEFAULT_MODELS,model:"",mode:"direct",repo:"",gh:""},store.get("cfg",{}));
let chats=store.get("chats",[]);
let cur=null, ctrl=null, busy=false;

/* ---------- Markdown（轻量，自带，无需外部库） ---------- */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s){
  return s.replace(/`([^`\n]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const blocks=[];
  src=src.replace(/```[^\n]*\n?([\s\S]*?)(```|$)/g,(m,c)=>{
    blocks.push('<pre><button class="copy">复制</button><code>'+esc(c.replace(/\n$/,""))+"</code></pre>");
    return "\u0000"+(blocks.length-1)+"\u0000";
  });
  src=esc(src);
  let h="",open=null,p=[];
  const fp=()=>{if(p.length){h+="<p>"+inline(p.join("<br>"))+"</p>";p=[]}};
  const fl=()=>{if(open){h+="</"+open+">";open=null}};
  for(const raw of src.split("\n")){
    let m;
    if(m=raw.match(/^\u0000(\d+)\u0000$/)){fp();fl();h+=blocks[+m[1]]}
    else if(m=raw.match(/^(#{1,6})\s+(.*)$/)){fp();fl();const n=Math.min(m[1].length+1,4);h+=`<h${n}>${inline(m[2])}</h${n}>`}
    else if(m=raw.match(/^\s*[-*+]\s+(.*)$/)){fp();if(open!=="ul"){fl();h+="<ul>";open="ul"}h+=`<li>${inline(m[1])}</li>`}
    else if(m=raw.match(/^\s*\d+[.)]\s+(.*)$/)){fp();if(open!=="ol"){fl();h+="<ol>";open="ol"}h+=`<li>${inline(m[1])}</li>`}
    else if(m=raw.match(/^&gt;\s?(.*)$/)){fp();fl();h+=`<blockquote>${inline(m[1])}</blockquote>`}
    else if(/^\s*$/.test(raw)){fp();fl()}
    else{fl();p.push(raw)}
  }
  fp();fl();
  return h.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[+i]||"");
}

/* ---------- 模型与设置 ---------- */
function parseModels(){
  return cfg.models.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const [id,name]=l.split("|");return {id:id.trim(),name:(name||id).trim()};
  });
}
function fillModels(){
  const list=parseModels(), sel=$("#model");
  sel.innerHTML=list.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
  const want=(cur&&cur.model)||cfg.model;
  sel.value=list.some(m=>m.id===want)?want:(list[0]?list[0].id:"");
}
$("#model").onchange=e=>{
  cfg.model=e.target.value;store.set("cfg",cfg);
  if(cur){cur.model=cfg.model;saveChats()}
};
function syncMode(){
  const g=$("#mode").value==="gh";
  $("#ghbox").style.display=g?"":"none";
  $("#keybox").style.display=g?"none":"";
}
$("#mode").onchange=syncMode;
$("#set").onclick=()=>{
  $("#key").value=cfg.key;$("#sys").value=cfg.system;$("#mods").value=cfg.models;
  $("#mode").value=cfg.mode;$("#repo").value=cfg.repo;$("#gh").value=cfg.gh;syncMode();
  $("#dlg").showModal();
};
$("#cancel").onclick=()=>$("#dlg").close();
$("#save").onclick=()=>{
  cfg.mode=$("#mode").value;cfg.repo=$("#repo").value.trim();cfg.gh=$("#gh").value.trim();
  cfg.key=$("#key").value.trim();cfg.system=$("#sys").value.trim();
  cfg.models=$("#mods").value.trim()||DEFAULT_MODELS;
  store.set("cfg",cfg);fillModels();$("#dlg").close();
};

/* ---------- 对话数据 ---------- */
function saveChats(){store.set("chats",chats)}
function newChat(){
  cur={id:Date.now().toString(36),title:"新对话",model:cfg.model,messages:[]};
  chats.unshift(cur);
  render();fillModels();$("#inp").focus();
}
function openChat(id){
  const c=chats.find(x=>x.id===id);if(!c)return;
  if(busy&&ctrl)ctrl.abort();
  cur=c;closeDrawer();render();fillModels();
}
function renderList(){
  $("#list").innerHTML=chats.filter(c=>c.messages.length).map(c=>
    `<div class="item${cur&&c.id===cur.id?" on":""}"><button class="t" data-open="${c.id}">${esc(c.title)}</button><button class="x" data-del="${c.id}" aria-label="删除">✕</button></div>`
  ).join("")||'<div class="empty" style="margin:20px;font-size:15px">还没有记录</div>';
}
$("#list").onclick=e=>{
  const o=e.target.closest("[data-open]"),d=e.target.closest("[data-del]");
  if(o)openChat(o.dataset.open);
  if(d){
    chats=chats.filter(c=>c.id!==d.dataset.del);saveChats();
    if(cur&&cur.id===d.dataset.del){cur=null;newChat()}else renderList();
  }
};
const openDrawer=()=>{renderList();$("#drawer").classList.add("open");$("#scrim").classList.add("open")};
const closeDrawer=()=>{$("#drawer").classList.remove("open");$("#scrim").classList.remove("open")};
$("#hist").onclick=openDrawer;$("#scrim").onclick=closeDrawer;
$("#new").onclick=()=>{
  if(busy&&ctrl)ctrl.abort();
  chats=chats.filter(c=>c.messages.length);
  newChat();
};

/* ---------- 渲染 ---------- */
function msgHTML(m,i,last){
  if(m.role==="user")return `<div class="msg user"><div class="body">${esc(m.content)}</div></div>`;
  const body=md(m.content||"")+(m.error?`<div class="err">${esc(m.error)}</div>`:"");
  const acts=(busy&&last)?"":`<div class="acts"><button data-copy="${i}">复制</button>${last?'<button data-regen="1">重新生成</button>':""}</div>`;
  return `<div class="msg assistant" data-i="${i}"><div class="body${busy&&last&&!m.content&&!m.error?" cursor":""}">${body}</div>${acts}</div>`;
}
function render(){
  const ms=cur?cur.messages:[];
  $("#msgs").innerHTML=ms.length
    ?ms.map((m,i)=>msgHTML(m,i,i===ms.length-1)).join("")
    :'<div class="empty">开始对话</div>';
  scrollDown(true);
}
function scrollDown(force){
  const mn=$("#main");
  if(force||mn.scrollHeight-mn.scrollTop-mn.clientHeight<160)mn.scrollTop=mn.scrollHeight;
}
$("#msgs").onclick=e=>{
  const c=e.target.closest(".copy");
  if(c){navigator.clipboard.writeText(c.parentElement.querySelector("code").innerText);c.textContent="已复制";setTimeout(()=>c.textContent="复制",1200);return}
  const b=e.target.closest("[data-copy]");
  if(b){navigator.clipboard.writeText(cur.messages[+b.dataset.copy].content||"");b.textContent="已复制";setTimeout(()=>b.textContent="复制",1200);return}
  if(e.target.closest("[data-regen]")){
    const ms=cur.messages;
    if(ms.length&&ms[ms.length-1].role==="assistant")ms.pop();
    run();
  }
};

/* ---------- 发送与流式输出 ---------- */
function setBusy(v){busy=v;document.body.classList.toggle("busy",v);$("#send").textContent=v?"停止":"发送"}
/* ---------- GitHub 中转：评论触发 Actions，Actions 调 OpenRouter 后回帖 ---------- */
const sleep=(ms,sig)=>new Promise((res,rej)=>{
  const t=setTimeout(res,ms);
  sig.addEventListener("abort",()=>{clearTimeout(t);rej(new DOMException("","AbortError"))},{once:true});
});
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com/repos/"+cfg.repo+path,{
    ...opt,signal:ctrl.signal,
    headers:{Authorization:"Bearer "+cfg.gh,Accept:"application/vnd.github+json","Content-Type":"application/json"}
  });
  if(!r.ok){let t=await r.text(),m=t;try{m=JSON.parse(t).message}catch{}throw new Error("GitHub "+r.status+" "+m)}
  return r.json();
}
async function relay(a,model,el){
  const ms=cur.messages,lastUser=ms[ms.length-2];
  if(!cur.issue){
    let body=cfg.system||"(无)";
    const prior=ms.slice(0,-2);
    if(prior.length)body+="\n\n以下是此前的对话记录：\n"+prior.map(m=>(m.role==="user"?"用户：":"助手：")+m.content).join("\n");
    const is=await gh("/issues",{method:"POST",body:JSON.stringify({title:cur.title,body})});
    cur.issue=is.number;saveChats();
  }
  const text=lastUser.sent?"<!--regen-->":lastUser.content;
  const c=await gh(`/issues/${cur.issue}/comments`,{method:"POST",body:JSON.stringify({body:`<!--model:${model}-->\n`+text})});
  lastUser.sent=true;saveChats();
  const t0=Date.now();
  for(;;){
    await sleep(3000,ctrl.signal);
    const s=Math.round((Date.now()-t0)/1000);
    const b=el();if(b&&!a.content)b.textContent=`等待 GitHub 处理… ${s} 秒`;
    if(s>300)throw new Error("等待超过 5 分钟。请到中转仓库的 Actions 页面查看运行日志。");
    const list=await gh(`/issues/${cur.issue}/comments?since=${c.created_at}&per_page=100`);
    const hit=list.find(x=>x.body.includes(`<!--re:${c.id}-->`));
    if(hit){
      const raw=hit.body.replace(/<!--re:\d+-->/g,"").trim();
      if(raw.startsWith("<!--err-->"))throw new Error(raw.replace("<!--err-->","").trim());
      a.content=raw;return;
    }
  }
}
async function run(){
  if(cfg.mode==="gh"?(!cfg.gh||!cfg.repo):!cfg.key){$("#set").click();return}
  const model=$("#model").value;
  cur.model=model;
  const a={role:"assistant",content:""};
  cur.messages.push(a);
  setBusy(true);render();
  const payload=[];
  if(cfg.system)payload.push({role:"system",content:cfg.system});
  cur.messages.slice(0,-1).forEach(m=>payload.push({role:m.role,content:m.content}));

  ctrl=new AbortController();
  let pending=false;
  const el=()=>$("#msgs").querySelector(".msg.assistant:last-child .body");
  const paint=()=>{
    if(pending)return;pending=true;
    requestAnimationFrame(()=>{pending=false;const b=el();if(b){b.innerHTML=md(a.content);scrollDown()}});
  };
  try{
    if(cfg.mode==="gh"){await relay(a,model,el)}else{
    const r=await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",signal:ctrl.signal,
      headers:{
        "Authorization":"Bearer "+cfg.key,
        "Content-Type":"application/json",
        "HTTP-Referer":location.origin||"https://localhost",
        "X-Title":"Simple Chat"
      },
      body:JSON.stringify({model,messages:payload,stream:true})
    });
    if(!r.ok){
      let t=await r.text(),msg=t;
      try{msg=JSON.parse(t).error.message}catch{}
      throw new Error(r.status+" "+msg);
    }
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;
        const d=line.slice(5).trim();if(d==="[DONE]")continue;
        try{
          const j=JSON.parse(d);
          if(j.error)throw new Error(j.error.message||"模型返回错误");
          const t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(t){a.content+=t;paint()}
        }catch(e){if(e.name!=="SyntaxError")throw e}
      }
    }
    }
  }catch(e){
    if(e.name!=="AbortError"){
      a.error=(e.message||"请求失败")+(a.content?"\n（以上为已收到的部分内容）":"");
    }
  }
  if(!a.content&&!a.error)cur.messages.pop();
  setBusy(false);ctrl=null;
  if(a.error&&a.content){a.content+="\n\n";}
  saveChats();render();
}
function send(){
  if(busy){if(ctrl)ctrl.abort();return}
  const inp=$("#inp"),text=inp.value.trim();if(!text)return;
  if(!cur)newChat();
  if(!cur.messages.length)cur.title=text.slice(0,24);
  cur.messages.push({role:"user",content:text});
  inp.value="";fit();saveChats();run();
}
$("#send").onclick=send;
const inp=$("#inp");
const fit=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,window.innerHeight*0.4)+"px"};
inp.addEventListener("input",fit);
inp.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&!matchMedia("(pointer:coarse)").matches){
    e.preventDefault();send();
  }
});

/* ---------- 启动 ---------- */
chats=chats.filter(c=>c.messages&&c.messages.length);
fillModels();
if(chats.length){cur=chats[0];render();fillModels()}else newChat();
if(!cfg.key)setTimeout(()=>$("#set").click(),300);
</script>
</body>
</html>
